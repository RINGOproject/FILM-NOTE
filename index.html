  <meta property="og:description" content="영화를 사랑하는 사람들의 평론 커뮤니티. 리뷰를 작성하고 공유하세요.">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://filmnote.app/">
  <meta property="twitter:title" content="FILM NOTE - 영화 평론 커뮤니티">
  <meta property="twitter:description" content="영화를 사랑하는 사람들의 평론 커뮤니티. 리뷰를 작성하고 공유하세요.">

  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png">
    
  <!-- iOS 상태바 스타일 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FILM NOTE">

  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">

  <title>FILM NOTE - 영화 평론 커뮤니티</title>
  
  <!-- Preload critical resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
</head>
<body>
  <noscript>
    <div style="padding: 20px; text-align: center; font-family: sans-serif;">
      <h1>JavaScript가 필요합니다</h1>
      <p>FILM NOTE를 사용하려면 JavaScript를 활성화해주세요.</p>
    </div>
  </noscript>
  
  <div id="root"></div>
  
  <!-- Service Worker 등록 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', {
          scope: '/'
        })
          .then(registration => {
            console.log('✅ Service Worker registered successfully:', registration.scope);
            
            // 업데이트 확인
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('🔄 New Service Worker found, installing...');
              
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('✨ New version available! Please refresh.');
                  
                  // 사용자에게 새 버전 알림 (선택사항)
                  if (confirm('새로운 버전이 사용 가능합니다. 지금 업데이트하시겠습니까?')) {
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch(err => {
            console.error('❌ Service Worker registration failed:', err);
          });
      });
      
      // Service Worker 메시지 리스너
      navigator.serviceWorker.addEventListener('message', (event) => {
        console.log('📨 Message from Service Worker:', event.data);
        
        if (event.data.type === 'CACHE_UPDATED') {
          console.log('💾 Cache has been updated');
        }
      });
    } else {
      console.log('⚠️ Service Workers are not supported in this browser');
    }
  </script>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
